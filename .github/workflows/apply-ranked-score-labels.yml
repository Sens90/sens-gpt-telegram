name: Apply Ranked score labels
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Add Ranked score labels patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Ranked score labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('community_features.py')
          s=p.read_text()
          marker='''    def _club_name_from_player(self, player):\n'''
          helper='''    @staticmethod\n    def ranked_score_label(score):\n        try:\n            score = int(score)\n        except (TypeError, ValueError):\n            return None\n        # Current Ranked score thresholds. Legendary uses 750-point minor ranks;\n        # Masters uses 1000-point minor ranks; Pro begins at 11250.\n        thresholds = [\n            (11250, "Pro"),\n            (10250, "Masters III"), (9250, "Masters II"), (8250, "Masters I"),\n            (7500, "Legendary III"), (6750, "Legendary II"), (6000, "Legendary I"),\n            (5500, "Mythic III"), (5000, "Mythic II"), (4500, "Mythic I"),\n            (4000, "Diamond III"), (3500, "Diamond II"), (3000, "Diamond I"),\n            (2500, "Gold III"), (2000, "Gold II"), (1500, "Gold I"),\n            (1250, "Silver III"), (1000, "Silver II"), (750, "Silver I"),\n            (500, "Bronze III"), (250, "Bronze II"), (0, "Bronze I"),\n        ]\n        for minimum, label in thresholds:\n            if score >= minimum:\n                return label\n        return "Bronze I"\n\n    def _ranked_value_text(self, value):\n        label = self.ranked_score_label(value)\n        score = self.number_formatter(value)\n        return f"{score} punti - {label}" if label else score\n\n'''
          if helper not in s:
              if marker not in s: raise SystemExit('club marker missing')
              s=s.replace(marker,helper+marker,1)
          old='''        for i,row in enumerate(rows[:60],1):\n            lines.append(f"{i}. {row['name']} - {self.number_formatter(row['value'])}")\n'''
          new='''        for i,row in enumerate(rows[:60],1):\n            if stat_key.startswith("classificata"):\n                value_text = self._ranked_value_text(row["value"])\n            else:\n                value_text = self.number_formatter(row["value"])\n            lines.append(f"{i}. {row['name']} - {value_text}")\n'''
          if old not in s: raise SystemExit('stat ranking output block missing')
          s=s.replace(old,new,1)
          old2='''            if rows: lines.append(f"{label}: 1° {rows[0]['name']} - {self.number_formatter(rows[0]['value'])}")\n'''
          new2='''            if rows:\n                value_text = self._ranked_value_text(rows[0]["value"]) if key.startswith("classificata") else self.number_formatter(rows[0]["value"])\n                lines.append(f"{label}: 1° {rows[0]['name']} - {value_text}")\n'''
          if old2 not in s: raise SystemExit('all stats output block missing')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          python -m py_compile community_features.py app.py player_tracking.py
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add community_features.py
          git commit -m "Show Ranked score with rank division"
          git push