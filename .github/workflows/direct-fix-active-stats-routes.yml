name: Direct fix active stats routes
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/direct-fix-active-stats-routes.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact active handlers
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py'); s=p.read_text()
          old='''        if player.get("icon_url"):
            try:
                await context.bot.send_photo(
                    chat_id=message.chat_id,
                    photo=player["icon_url"],
                    caption=text
                )
            except Exception as exc:
                print("ERRORE FOTO PROFILO:", repr(exc), flush=True)
                await context.bot.send_message(chat_id=message.chat_id, text=text)
        else:
            await context.bot.send_message(chat_id=message.chat_id, text=text)
        return
'''
          new='''        live_club = player.get("club") or player.get("club_name")
        if live_club:
            player["club_name"] = live_club
        elif member_data:
            player["club_name"] = member_data.get("club_name")
        player["ranked_current"] = ranked_current
        player["ranked_season_peak"] = ranked_season_peak
        player["ranked_career_peak"] = ranked_peak
        change_rows = [
            ("Oggi", format_trophy_change(changes.get("today"))),
            ("7 giorni", format_trophy_change(changes.get("7d"))),
            ("15 giorni", format_trophy_change(changes.get("15d"))),
            ("30 giorni", format_trophy_change(changes.get("30d"))),
            ("90 giorni", format_trophy_change(changes.get("90d"))),
        ]
        try:
            card = make_bs_stats_card(player, change_rows)
            await context.bot.send_photo(chat_id=message.chat_id, photo=card)
        except Exception as exc:
            print("ERRORE SCHEDA STATS GRAFICA:", repr(exc), flush=True)
            await context.bot.send_message(chat_id=message.chat_id, text=text)
        return
'''
          if old not in s: raise SystemExit('active profile sender not found')
          s=s.replace(old,new,1); p.write_text(s)
          p=Path('community_features.py'); c=p.read_text()
          replacements={
            'await message.reply_text(self.stat_ranking_text(message.chat_id,stat_aliases[stat.group(1).lower()])); return True':'from app import send_bs_stat_ranking; await send_bs_stat_ranking(message,context,self,stat_aliases[stat.group(1).lower()]); return True',
            'await message.reply_text(self.stat_ranking_text(message.chat_id,stat_aliases[clubstat.group(2).lower()],self.CLUB_ALIASES[clubstat.group(1).lower()])); return True':'from app import send_bs_stat_ranking; await send_bs_stat_ranking(message,context,self,stat_aliases[clubstat.group(2).lower()],self.CLUB_ALIASES[clubstat.group(1).lower()]); return True',
            'await message.reply_text(self.stat_ranking_text(message.chat_id,"3v3",club_name)); return True':'from app import send_bs_stat_ranking; await send_bs_stat_ranking(message,context,self,"3v3",club_name); return True',
            'await message.reply_text(self.stat_ranking_text(message.chat_id,stat_key,club_name)); return True':'from app import send_bs_stat_ranking; await send_bs_stat_ranking(message,context,self,stat_key,club_name); return True',
          }
          for x,y in replacements.items(): c=c.replace(x,y)
          p.write_text(c)
          PY
      - name: Validate exact wiring
        run: |
          python -m py_compile app.py community_features.py player_tracking.py
          grep -q 'card = make_bs_stats_card(player, change_rows)' app.py
          grep -q 'send_bs_stat_ranking' community_features.py
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py community_features.py
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m 'Wire active stats and rankings to visual cards'
          git push
# rerun 2026-09-16
