name: Patch live player routing

on:
  push:
    paths:
      - '.github/workflows/patch-player-routing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()

          s = s.replace(
              'from player_tracking import extract_brawlzone_ranked',
              'from player_tracking import extract_brawlzone_ranked, get_brawltrack_player'
          )

          old = '''def get_brawlzone_player(player_tag):\n    try:\n        tag = player_tag.upper().replace("#", "").strip()'''
          new = '''def get_brawlzone_player(player_tag):\n    # BrawlTrack is the primary live source. BrawlZone is only a fallback.\n    primary = get_brawltrack_player(player_tag)\n    if primary and primary.get("name") and primary.get("trophies") is not None:\n        primary["club_name"] = primary.get("club") or primary.get("club_name")\n        return primary\n    try:\n        tag = player_tag.upper().replace("#", "").strip()'''
          if old not in s:
              raise SystemExit('player fetcher anchor not found')
          s = s.replace(old, new, 1)

          old_regex = '''r"(?:stats|profilo|scheda)\\s+#?([0289PYLQGRJCUV]{3,15})",'''
          new_regex = '''r"(?:stats|statistiche|profilo|scheda|status(?:\\s+(?:del\\s+)?giocatore)?|stato(?:\\s+(?:del\\s+)?giocatore)?)\\s*(?:di\\s+)?#?([0289PYLQGRJCUV]{3,15})",'''
          if old_regex not in s:
              raise SystemExit('stats regex anchor not found')
          s = s.replace(old_regex, new_regex, 1)

          s = s.replace(
              '''ranked_current = (\n            (member_data or {}).get("ranked_current")\n            or player.get("ranked_current")''',
              '''ranked_current = (\n            player.get("ranked_current")\n            or (member_data or {}).get("ranked_current")''',
              1,
          )
          s = s.replace(
              '''ranked_season_peak = (\n            (member_data or {}).get("ranked_season_peak")\n            or player.get("ranked_season_peak")''',
              '''ranked_season_peak = (\n            player.get("ranked_season_peak")\n            or (member_data or {}).get("ranked_season_peak")''',
              1,
          )
          s = s.replace(
              '''ranked_peak = (\n            (member_data or {}).get("ranked_peak")\n            or player.get("ranked_peak")''',
              '''ranked_peak = (\n            player.get("ranked_career_peak")\n            or player.get("ranked_peak")\n            or (member_data or {}).get("ranked_peak")''',
              1,
          )

          old_tag = '''    stats_match = re.fullmatch(\n        r"(?:stats|statistiche|profilo|scheda|status(?:\\s+(?:del\\s+)?giocatore)?|stato(?:\\s+(?:del\\s+)?giocatore)?)\\s*(?:di\\s+)?#?([0289PYLQGRJCUV]{3,15})",\n        question.strip(),\n        re.I\n    )'''
          new_tag = '''    stats_match = re.fullmatch(\n        r"(?:stats|statistiche|profilo|scheda|status(?:\\s+(?:del\\s+)?giocatore)?|stato(?:\\s+(?:del\\s+)?giocatore)?)\\s*(?:di\\s+)?#?([0289PYLQGRJCUV]{3,15})",\n        question.strip(),\n        re.I\n    )\n    if not stats_match:\n        # Natural-language safety net: a player tag plus a clear profile intent\n        # must never be sent to Gemini.\n        tag_match = re.search(r"#([0289PYLQGRJCUV]{3,15})", question, re.I)\n        intent = re.search(r"\\b(status|stato|statistiche|stats|profilo|scheda|giocatore)\\b", question, re.I)\n        if tag_match and intent:\n            stats_match = tag_match'''
          if old_tag not in s:
              raise SystemExit('natural language anchor not found')
          s = s.replace(old_tag, new_tag, 1)

          p.write_text(s)
          PY
      - name: Syntax check
        run: python -m py_compile app.py player_tracking.py community_features.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "Route player status directly through BrawlTrack"
          git push
