name: Install Premium AI commands
on:
  push:
    paths:
      - '.github/workflows/install-premium-commands.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text()
          imp='from premium_ai import handle_premium_command\n'
          anchor='from live_maps import collect_report, render_report, report_csv\n'
          if imp not in s:
              s=s.replace(anchor, anchor+imp)
          hook='''    if await handle_premium_command(\n        message, context, question, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY\n    ):\n        return\n\n'''
          anchor2='    if await community.continue_registration(message, context):\n'
          if hook not in s:
              if anchor2 not in s:
                  raise SystemExit('answer hook anchor not found')
              s=s.replace(anchor2, hook+anchor2, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enable Premium AI admin commands'
          git push
