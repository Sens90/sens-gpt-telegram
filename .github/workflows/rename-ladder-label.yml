name: Apply Ladder terminology correction
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename trophy meta terminology to Ladder
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()
          s = s.replace('"ladder", "trofei", "trofeo", "coppe", "coppa",\n        "push", "pushare", "scalare", "scala trofei"', '"ladder", "scalata", "scalare", "push", "pushare",\n        "trofei", "trofeo", "coppe", "coppa", "scala trofei"')
          s = s.replace('context_hint = "trophy ladder trofei current event rotation"', 'context_hint = "Ladder Scalata current event rotation"')
          s = s.replace('f"trophy ladder Ranked"', 'f"Ladder Scalata Ranked"')
          s = s.replace('"trofei" not in lowered or "classificat" not in lowered', '("ladder" not in lowered and "scalata" not in lowered) or "classificat" not in lowered')
          p.write_text(s)
          PY
          python -m py_compile app.py
      - name: Commit correction and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/rename-ladder-label.yml
          git add app.py
          git commit -m "Use Ladder and Scalata terminology"
          git push origin main
