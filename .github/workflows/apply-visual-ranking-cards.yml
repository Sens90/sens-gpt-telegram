name: Apply visual ranking cards
on:
  push:
    paths:
      - '.github/workflows/apply-visual-ranking-cards.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add visual ranking cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('app.py')
          s=p.read_text()
          if 'def build_ranking_card(' not in s:
              # imports
              anchor='import re\n'
              if anchor in s:
                  s=s.replace(anchor, anchor+'from io import BytesIO\nimport requests\nfrom PIL import Image, ImageDraw, ImageFont\n',1)
              # helpers before first async handler
              marker='\nasync def '
              helper=r'''
def _ranking_font(size, bold=False):
    paths = [
        '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',
        '/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf',
    ]
    for path in paths:
        try:
            return ImageFont.truetype(path, size)
        except Exception:
            pass
    return ImageFont.load_default()


def _load_player_icon(url, size=72):
    if not url:
        return None
    try:
        r=requests.get(url, timeout=8)
        r.raise_for_status()
        im=Image.open(BytesIO(r.content)).convert('RGBA')
        im.thumbnail((size,size), Image.Resampling.LANCZOS)
        canvas=Image.new('RGBA',(size,size),(0,0,0,0))
        canvas.alpha_composite(im,((size-im.width)//2,(size-im.height)//2))
        return canvas
    except Exception as exc:
        print('ERRORE ICONA CLASSIFICA:', repr(exc), flush=True)
        return None


def build_ranking_card(title, rows, value_formatter=None):
    width=1080
    row_h=106
    header_h=170
    footer_h=45
    height=header_h + row_h*len(rows) + footer_h
    img=Image.new('RGB',(width,height),(20,23,31))
    draw=ImageDraw.Draw(img)
    title_font=_ranking_font(52,True)
    pos_font=_ranking_font(35,True)
    name_font=_ranking_font(34,True)
    value_font=_ranking_font(31,False)
    draw.text((45,42),title,fill=(255,255,255),font=title_font)
    draw.text((46,112),'TITANI ABUSIVI • Sens GPT',fill=(180,185,200),font=_ranking_font(24,False))
    for idx,row in enumerate(rows,1):
        y=header_h+(idx-1)*row_h
        if idx%2==0:
            draw.rounded_rectangle((25,y+4,width-25,y+row_h-4),radius=20,fill=(29,33,44))
        medal={1:'🥇',2:'🥈',3:'🥉'}.get(idx,str(idx))
        # Emoji fallback may not render in DejaVu, so use numeric podium badges.
        badge={1:'1',2:'2',3:'3'}.get(idx,str(idx))
        draw.text((45,y+31),badge,fill=(255,255,255),font=pos_font)
        icon=_load_player_icon(row.get('icon_url'),72)
        if icon:
            img.paste(icon,(115,y+17),icon)
        else:
            draw.ellipse((115,y+17,187,y+89),fill=(55,61,78))
            draw.text((138,y+36),'?',fill=(210,214,225),font=_ranking_font(28,True))
        name=str(row.get('name') or row.get('tag') or 'Giocatore')
        if len(name)>25: name=name[:24]+'…'
        draw.text((210,y+18),name,fill=(250,250,252),font=name_font)
        value=row.get('value')
        if value_formatter:
            value_text=value_formatter(row)
        elif value is not None:
            try: value_text=f"{int(value):,}".replace(',','.')
            except Exception: value_text=str(value)
        else:
            current=row.get('current')
            delta=row.get('delta')
            current_text=f"{int(current):,}".replace(',','.') if current is not None else '-'
            delta_text='storico non disponibile' if delta is None else (f"+{delta}" if delta>0 else str(delta))
            value_text=f"{current_text} trofei • {delta_text}"
        draw.text((210,y+60),value_text,fill=(190,196,210),font=value_font)
    out=BytesIO()
    img.save(out,format='PNG',optimize=True)
    out.seek(0)
    out.name='classifica.png'
    return out


async def send_ranking_cards(context, chat_id, title, rows, value_formatter=None, chunk_size=10):
    if not rows:
        return False
    for start in range(0,len(rows),chunk_size):
        chunk=rows[start:start+chunk_size]
        # Preserve absolute positions across multiple images.
        numbered=[]
        for i,row in enumerate(chunk,start+1):
            item=dict(row)
            item['_absolute_position']=i
            numbered.append(item)
        card=build_ranking_card(title if start==0 else f'{title} • {start+1}-{start+len(chunk)}',numbered,value_formatter)
        await context.bot.send_photo(chat_id=chat_id,photo=card)
    return True

'''
              if marker not in s:
                  raise SystemExit('async marker missing')
              s=s.replace(marker,'\n'+helper+marker,1)
          p.write_text(s)

          # Community feature helper exposes rows without changing existing text behavior.
          p=Path('community_features.py')
          s=p.read_text()
          if 'def stat_ranking_rows(' not in s:
              marker='    def stat_ranking_text(self, chat_id, stat_key, club_name=None):\n'
              helper='''    def stat_ranking_rows(self, chat_id, stat_key, club_name=None):\n        return self._stat_rows(chat_id, stat_key, club_name)\n\n'''
              if marker not in s: raise SystemExit('stat_ranking_text marker missing')
              s=s.replace(marker,helper+marker,1)
          p.write_text(s)
          PY
          python -m py_compile app.py community_features.py player_tracking.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py community_features.py
          git diff --cached --quiet && exit 0
          git commit -m 'Add visual ranking card renderer'
          git push
