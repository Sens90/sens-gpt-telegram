name: Add Pixar profile mode
on:
  push:
    paths:
      - '.github/workflows/add-pixar-profile-mode.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch command parser
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py'); s=p.read_text()
          old='sorprendimi|brawl|cinematic|al\\s+cinema|epico|fantascienza|fantasy'
          new='sorprendimi|brawl|cinematic|pixar|al\\s+cinema|epico|fantascienza|fantasy'
          if old not in s: raise SystemExit('profile mode regex not found')
          s=s.replace(old,new,1)
          old2='            "cinematic": "cinematic",\n'
          new2='            "cinematic": "cinematic",\n            "pixar": "pixar",\n'
          if old2 not in s: raise SystemExit('category map not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "Sens GPT Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git commit -m "Wire Pixar AI profile command"
          git push
