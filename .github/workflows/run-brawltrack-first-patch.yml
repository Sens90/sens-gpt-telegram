name: Patch BrawlTrack first branch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brawltrack-first-meta-maps
      - name: Patch app.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py'); s=p.read_text()
          old='''    if "supercell.com" in url_lower or "brawlstars.com" in url_lower:\n        return 0\n    if "brawlplanet.com" in url_lower or "brawlplanet.nl" in url_lower:\n        return 1\n    if "brawlify.com" in url_lower or "brawltime.ninja" in url_lower:\n        return 2\n    if "noff.gg" in url_lower:\n        return 3\n    return 4'''
          new='''    if "brawltrack.app" in url_lower:\n        return 0\n    if "supercell.com" in url_lower or "brawlstars.com" in url_lower:\n        return 1\n    if "brawlplanet.com" in url_lower or "brawlplanet.nl" in url_lower:\n        return 2\n    if "brawlify.com" in url_lower or "brawltime.ninja" in url_lower:\n        return 3\n    if "noff.gg" in url_lower:\n        return 4\n    return 5'''
          assert old in s; s=s.replace(old,new)
          old='''        if "/it/maps/" in url and "brawlplanet.com" in url:\n            return 0\n        if italian_planet_url(result.get("url", "")):\n            return 1\n        if result.get("source_role") == "secondary_fallback":\n            return 3\n        return 2'''
          new='''        if "brawltrack.app" in url and "/maps/" in url:\n            return 0\n        if "/it/maps/" in url and "brawlplanet.com" in url:\n            return 1\n        if italian_planet_url(result.get("url", "")):\n            return 2\n        if result.get("source_role") == "secondary_fallback":\n            return 4\n        return 3'''
          assert old in s; s=s.replace(old,new)
          old='''        source_role = (\n            "FONTE SECONDARIA - usare solo se Brawl Planet non ha il dato"\n            if is_secondary\n            else (\n                "FONTE PRIMARIA BRAWL PLANET"\n                if italian_planet_url(url)\n                else "ALTRA FONTE"\n            )\n        )'''
          new='''        if "brawltrack.app" in url.casefold():\n            source_role = "FONTE PRIMARIA BRAWLTRACK"\n        elif italian_planet_url(url):\n            source_role = "FONTE FALLBACK BRAWL PLANET - usare solo se BrawlTrack non ha il dato"\n        elif is_secondary:\n            source_role = "FONTE SECONDARIA - usare solo se BrawlTrack e Brawl Planet non hanno il dato"\n        else:\n            source_role = "ALTRA FONTE"'''
          assert old in s; s=s.replace(old,new)
          old='''            f"site:brawlplanet.com/it Brawl Stars {query} {today} {context_hint} "\n            f"Active Maps best brawlers win rate pick rate Star Player team comp "\n            f"trophy ladder Ranked"'''
          new='''            f"Brawl Stars {query} {today} {context_hint} "\n            f"site:brawltrack.app/maps OR site:brawltrack.app/pro/maps "\n            f"BrawlTrack map preview Priority Picks win rate use rate Common Final Comps "\n            f"trophy ladder Ranked"'''
          assert old in s; s=s.replace(old,new)
          old='''            f"(site:brawlplanet.nl/it/meta OR site:brawlplanet.com/meta OR "\n            f"site:brawlplanet.com/tier-list OR site:brawlplanet.nl/it/tier-list) "\n            f"Brawl Planet tier list meta win rate pick rate Star Player current rotation "'''
          new='''            f"(site:brawltrack.app/brawlers OR site:brawltrack.app/ranked OR site:brawltrack.app/maps) "\n            f"BrawlTrack tier list meta win rate Meta Usage Star Rate current maps team comps "'''
          assert old in s; s=s.replace(old,new)
          needle='''    if is_map_query:\n        # Read localized page contents, not just search snippets.'''
          repl='''    if is_map_query:\n        # BrawlTrack-first: enrich exact map pages returned by search.\n        track_urls = list(dict.fromkeys(\n            result.get("url") for result in data.get("results", [])\n            if result.get("url") and "brawltrack.app" in result.get("url", "").casefold()\n            and "/maps/" in result.get("url", "")\n        ))[:20]\n        if track_urls:\n            try:\n                track_extract = requests.post(\n                    "https://api.tavily.com/extract",\n                    json={"api_key": TAVILY_API_KEY, "urls": track_urls, "extract_depth": "advanced"},\n                    timeout=30\n                )\n                track_extract.raise_for_status()\n                track_results = track_extract.json().get("results", [])\n                for result in track_results:\n                    result["source_role"] = "primary_brawltrack"\n                data["results"] = track_results + data.get("results", [])\n            except Exception as e:\n                print("BRAWLTRACK: estrazione mappe non disponibile", repr(e), flush=True)\n\n        # Brawl Planet remains the localized fallback when BrawlTrack lacks data.\n        # Read localized page contents, not just search snippets.'''
          assert needle in s; s=s.replace(needle,repl)
          p.write_text(s)
          PY
          python -m py_compile app.py live_maps.py player_tracking.py
      - name: Commit branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py
          git commit -m "Prefer BrawlTrack for meta maps and comps"
          git push origin HEAD:brawltrack-first-meta-maps
