name: Apply visual stats and registration cards
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-visual-stats-and-registration.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text()
          marker='def needs_web_search(question):'
          helper=r'''
# Visual player stats card: real player icon plus Brawl Stars statistic logos.
STAT_VISUAL_ICON_URLS = {
    "trophies": "https://cdn.brawlify.com/icon/trophy.png",
    "brawlers": "https://cdn.brawlify.com/icon/brawler.png",
    "level": "https://cdn.brawlify.com/icon/level.png",
    "prestige": "https://cdn.brawlify.com/icon/prestige.png",
    "wins_3v3": "https://cdn.brawlify.com/icon/3v3.png",
    "wins_solo": "https://cdn.brawlify.com/icon/solo-showdown.png",
    "wins_duo": "https://cdn.brawlify.com/icon/duo-showdown.png",
    "ranked_current": "https://cdn.brawlify.com/icon/ranked.png",
    "ranked_season_peak": "https://cdn.brawlify.com/icon/ranked.png",
    "ranked_career_peak": "https://cdn.brawlify.com/icon/ranked.png",
}


def _visual_fetch_image(url, size):
    try:
        from PIL import Image
        from io import BytesIO
        r=requests.get(url, timeout=8)
        r.raise_for_status()
        im=Image.open(BytesIO(r.content)).convert("RGBA")
        im.thumbnail((size,size))
        return im
    except Exception:
        return None


def build_player_stats_card(player, heading="STATISTICHE GIOCATORE"):
    from PIL import Image, ImageDraw, ImageFont
    from io import BytesIO
    W=1080
    rows=[
        ("trophies","Trofei",player.get("trophies")),
        ("brawlers","Brawler",player.get("brawlers")),
        ("level","Livello account",player.get("level")),
        ("prestige","Prestigio",player.get("prestige")),
        ("wins_3v3","Vittorie 3v3",player.get("wins_3v3")),
        ("wins_solo","Vittorie Solo",player.get("wins_solo")),
        ("wins_duo","Vittorie Duo",player.get("wins_duo")),
        ("ranked_current","Classificata attuale",player.get("ranked_current")),
        ("ranked_season_peak","Record stagione",player.get("ranked_season_peak")),
        ("ranked_career_peak","Record carriera",player.get("ranked_career_peak") or player.get("ranked_peak")),
    ]
    rows=[r for r in rows if r[2] is not None]
    H=260+len(rows)*82+50
    img=Image.new("RGB",(W,H),(18,22,32)); d=ImageDraw.Draw(img)
    try:
        fb=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",38)
        fn=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",29)
        fs=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",24)
    except Exception:
        fb=fn=fs=ImageFont.load_default()
    profile=_visual_fetch_image(player.get("icon_url"),128) if player.get("icon_url") else None
    if profile: img.paste(profile,(55,70),profile)
    else: d.ellipse((55,70,183,198),fill=(55,61,76))
    d.text((220,65),heading,font=fs,fill=(180,190,210))
    d.text((220,105),str(player.get("name") or "Giocatore"),font=fb,fill="white")
    d.text((220,160),str(player.get("tag") or ""),font=fs,fill=(180,190,210))
    y=245
    for key,label,value in rows:
        d.rounded_rectangle((45,y,1035,y+68),radius=16,fill=(29,35,49))
        icon=_visual_fetch_image(STAT_VISUAL_ICON_URLS.get(key),50)
        if icon: img.paste(icon,(65,y+9),icon)
        d.text((135,y+17),label,font=fn,fill=(220,225,235))
        txt=f"{value:,}".replace(",",".") if isinstance(value,int) else str(value)
        box=d.textbbox((0,0),txt,font=fn)
        d.text((1005-(box[2]-box[0]),y+17),txt,font=fn,fill="white")
        y+=82
    out=BytesIO(); img.save(out,"PNG"); out.seek(0); return out


async def send_visual_player_stats(context, chat_id, player, heading="STATISTICHE GIOCATORE", caption=None):
    try:
        card=build_player_stats_card(player, heading)
        await context.bot.send_photo(chat_id=chat_id, photo=card, caption=caption)
        return True
    except Exception as exc:
        print("ERRORE SCHEDA STATS:",repr(exc),flush=True)
        return False


'''
          if 'def build_player_stats_card(' not in s:
              s=s.replace(marker,helper+marker)
          p.write_text(s)
          PY
      - name: Patch existing player replies
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py'); s=p.read_text()
          # Upgrade the already-existing profile photo reply: send the full visual stats card first.
          old='''if player.get("icon_url"):\n            await context.bot.send_photo(chat_id=message.chat_id, photo=player.get("icon_url"), caption=text)\n        else:\n            await message.reply_text(text)'''
          new='''if not await send_visual_player_stats(context, message.chat_id, player, "STATISTICHE GIOCATORE", text):\n            if player.get("icon_url"):\n                await context.bot.send_photo(chat_id=message.chat_id, photo=player.get("icon_url"), caption=text)\n            else:\n                await message.reply_text(text)'''
          if old in s: s=s.replace(old,new)
          # Registration responses commonly contain the player object followed by confirmation text.
          # Where a registration confirmation is sent, add the same card without changing registration logic.
          needles=['await message.reply_text(registration_text)','await message.reply_text(response_text)']
          for n in needles:
              if n in s and 'registr' in s[max(0,s.find(n)-1200):s.find(n)].lower():
                  repl='''await send_visual_player_stats(context, message.chat_id, player, "REGISTRAZIONE COMPLETATA")\n        '''+n
                  s=s.replace(n,repl,1)
          p.write_text(s)
          PY
      - name: Validate and commit
        run: |
          python -m py_compile app.py community_features.py player_tracking.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Render original Brawl Stars icons in stats cards'
          git push
