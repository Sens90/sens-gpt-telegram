name: Apply meta quality fix
on:
  push:
    branches: [fix-meta-output-quality]
    paths: [.github/workflows/apply-meta-quality-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-meta-output-quality
      - name: Patch app meta instructions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text()
          replacements={
          'Gerarchia fonti per il meta: 1) Supercell/Brawl Stars ufficiale per patch, buff, nerf e modifiche; 2) Brawl Planet Tier List/Meta per il meta generale aggiornato; 3) Brawl Planet dati specifici, Brawlify e Brawl Time Ninja per statistiche di modalità, mappe e andamento competitivo; 4) Noff come supporto; 5) altre fonti community solo come conferma secondaria.':'Gerarchia fonti per il meta: 1) BrawlTrack per meta, mappe, statistiche e composizioni; 2) Supercell/Brawl Stars ufficiale per patch, buff, nerf e modifiche; 3) Brawl Planet solo come fallback quando BrawlTrack non ha il dato; 4) Brawlify, Brawl Time Ninja e Noff solo come supporto secondario.',
          "META GENERALE: per domande come 'chi è meta?', 'tier list', 'migliori brawler adesso' usa come fonte primaria la Tier List e la pagina Meta aggiornate di Brawl Planet, confrontandole con gli ultimi bilanciamenti ufficiali Supercell.":"META GENERALE: per domande come 'chi è meta?', 'tier list', 'migliori brawler adesso' usa BrawlTrack come fonte primaria e confronta con gli ultimi bilanciamenti ufficiali Supercell; usa Brawl Planet solo come fallback.",
          'Per statistiche per mappa usa Brawl Planet come fonte prioritaria quando disponibile: distingue Ladder e Ranked e mostra tasso di vittoria, tasso di utilizzo, Miglior Star Player e composizioni.':'Per statistiche per mappa usa BrawlTrack come fonte prioritaria. Brawl Planet è solo fallback. Mantieni distinti Ladder, Classificata e Competitivo.',
          'Usa prioritariamente le pagine /it di Brawl Planet e conserva i nomi italiani presenti nella fonte; non ritradurli. Rinomina giocatore stella in Miglior Star Player.':'Conserva i nomi italiani/localizzati forniti dalla fonte. Usa sempre la dicitura Miglior Star Player.',
          'Per ogni blocco specifica mappa, modalità, Trofei o Classificata, eventuale lega/filtro, periodo e aggiornamento se pubblicati. Dato assente: Non disponibile. Se manca un dato consulta le fonti secondarie senza mescolare campioni di fonti diverse.':'Per ogni blocco specifica mappa, modalità e Ladder o Classificata quando utile. Non riempire la risposta con campi Non disponibile: ometti le metriche assenti. Se manca un dato consulta il fallback senza mescolare campioni di fonti diverse.',
          'Per OGNI mappa crea sempre quattro sottosezioni: Trofei - Individuali, Trofei - Squadre, Classificata - Individuali e Classificata - Squadre. Se una tabella non è pubblicata, scrivi Non disponibile.':'Usa le etichette Ladder - Individuali, Ladder - Squadre, Classificata - Individuali e Classificata - Squadre solo quando il relativo dataset è realmente disponibile. Se la Classificata non è verificata per quella mappa, dillo in una sola frase senza creare sezioni vuote.',
          'Se una metrica manca per un Brawler, scrivi Non disponibile invece di ricavarla da un altro giocatore o da un altro dataset.':'Se una metrica manca per un Brawler, omettila e non ricavarla da un altro giocatore o dataset.',
          'Diffida di percentuali molto alte con utilizzo o campione molto basso; preferisci dati robusti e coerenti tra più indicatori.':'Escludi dai consigli meta Ladder i Brawler con utilizzo inferiore all 1% quando il tasso di utilizzo è disponibile. Diffida di percentuali alte con campione basso. Scarta sempre composizioni con lo stesso Brawler ripetuto.',
          'Trofei - Individuali, Trofei - Squadre, Classificata - Individuali, Classificata - Squadre.':'Ladder - Individuali, Ladder - Squadre, Classificata - Individuali, Classificata - Squadre.',
          '(r"\\bstar\\s+player\\b", "Star Player"),':'(r"\\bstar\\s+player\\b", "Miglior Star Player"),'
          }
          missing=[]
          for old,new in replacements.items():
              if old not in s:
                  missing.append(old[:70])
              s=s.replace(old,new)
          p.write_text(s)
          if missing:
              print('Patterns not found:', missing)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/apply-meta-quality-fix.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.py .github/workflows/apply-meta-quality-fix.yml
          git commit -m "Fix meta response quality and BrawlTrack priority"
          git push origin fix-meta-output-quality