name: Fix trophy today timezone

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-trophy-today.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calculate_trophy_changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '''    now = datetime.now(timezone.utc)\n\n    start_today = now.replace(\n        hour=0,\n        minute=0,\n        second=0,\n        microsecond=0\n    )'''
          new = '''    now = datetime.now(timezone.utc)\n    now_rome = now.astimezone(ROME)\n\n    # "Oggi" segue il giorno italiano, non la mezzanotte UTC.\n    start_today = now_rome.replace(\n        hour=0,\n        minute=0,\n        second=0,\n        microsecond=0\n    ).astimezone(timezone.utc)'''
          if new in s:
              print('Patch already applied')
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('Target block not found; refusing unsafe patch')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- app.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Fix trophy today calculation for Europe/Rome'
          git push
