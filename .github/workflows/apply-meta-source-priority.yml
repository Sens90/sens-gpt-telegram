name: Apply strict meta source priority
on:
  push:
    paths:
      - '.github/workflows/apply-meta-source-priority.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce BrawlTrack and Brawl Planet for meta
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text()
          old='''            f"latest balance changes competitive "\n            f"gadget abilità stellare equipaggiamento overdrive nomi italiani "\n            f"Supercell italiano Brawlify Brawl Time Ninja Noff"\n'''
          new='''            f"latest balance changes competitive "\n            f"gadget abilità stellare equipaggiamento overdrive nomi italiani "\n            f"site:brawltrack.app OR site:brawlplanet.com"\n'''
          if old not in s:
              raise SystemExit('meta search target not found')
          s=s.replace(old,new,1)

          marker='''    response.raise_for_status()\n    data = response.json()\n\n    if is_map_query:\n'''
          replacement='''    response.raise_for_status()\n    data = response.json()\n\n    if is_meta_query and not is_map_query:\n        # Meta is authoritative only when supported by BrawlTrack or Brawl Planet.\n        # Do not let Brawl Time Ninja/Brawlify/Noff statistics become a meta tier list.\n        allowed = []\n        for result in data.get("results", []):\n            url = (result.get("url") or "").casefold()\n            if "brawltrack.app" in url:\n                result["source_role"] = "primary_brawltrack"\n                allowed.append(result)\n            elif "brawlplanet.com" in url or "brawlplanet.nl" in url:\n                result["source_role"] = "fallback_brawlplanet"\n                allowed.append(result)\n        data["results"] = allowed\n        data["answer"] = None\n        data["meta_sources_verified"] = bool(allowed)\n\n    if is_map_query:\n'''
          if marker not in s:
              raise SystemExit('web result target not found')
          s=s.replace(marker,replacement,1)
          p.write_text(s)
          PY
          python -m py_compile app.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Enforce BrawlTrack and Brawl Planet for meta'
          git push
