name: Wake Render before ranking slots

on:
  schedule:
    # Run at both possible UTC offsets. The job itself checks Europe/Rome,
    # so DST/CET changes are handled automatically.
    - cron: '50 3,4,9,10,15,16 * * *'
    - cron: '49 21,22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Europe/Rome wake slot
        id: slot
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          local_hm="$(TZ=Europe/Rome date +%H:%M)"
          case "$local_hm" in
            05:50|11:50|17:50|23:49)
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping duplicate UTC trigger; Europe/Rome is $local_hm"
              ;;
          esac

      - name: Wake Sens GPT
        if: steps.slot.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          url="https://sens-gpt-telegram.onrender.com/"
          echo "Waking Render service..."
          curl --fail --silent --show-error \
            --retry 4 --retry-delay 15 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            "$url" -o /dev/null
          echo "Wake request completed."
