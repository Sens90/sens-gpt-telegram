name: Apply skin account phase 2 on test branch
on:
  push:
    branches:
      - sens-precommit-check
    paths:
      - '.github/workflows/apply-skin-account-phase2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sens-precommit-check
      - name: Apply patch
        run: python tools/apply_skin_phase2.py
      - name: Compile
        run: python -m py_compile community_features.py
      - name: Commit tested patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add community_features.py
          git commit -m 'Improve skin account categories and brawler summary'
          git push origin HEAD:sens-precommit-check
