name: Apply deterministic AI profile stats
on:
  push:
    paths: ['.github/workflows/apply-deterministic-ai-profile-stats.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch generator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai_profile_generator.py')
          s=p.read_text()
          s=s.replace('from PIL import Image\n','from PIL import Image, ImageDraw, ImageFont\n',1)
          old='''+_profile_data_prompt(player)+" Nome, tag, club e statistiche devono essere integrati fisicamente nella scenografia, senza box, card, pannelli, targhette traslucide, cornici o HUD sospesi. Mantieni TUTTI i testi completamente dentro una safe area interna, lontani dai quattro bordi, leggibili e senza tagli. Il Brawler resta protagonista.'''
          new='''+" NON scrivere nell'immagine nome, tag, club, trofei, livello, numero Brawler, Prestigio, vittorie o dati Classificata: il bot li applichera dopo in modo deterministico. Lascia zone visivamente pulite e con buon contrasto nella fascia alta e nella fascia bassa per la tipografia finale. Non creare pannelli, card, HUD o targhe per statistiche. Il Brawler resta protagonista.'''
          if old not in s: raise SystemExit('prompt stats block not found')
          s=s.replace(old,new,1)
          start=s.index('def overlay_stats(')
          replacement=r'''def _font(size,bold=False):
    candidates=[
        "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf" if bold else "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
        "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf" if bold else "/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf",
    ]
    for path in candidates:
        if os.path.exists(path): return ImageFont.truetype(path,size)
    return ImageFont.load_default()


def _fit_canvas(image,w=1080,h=1350):
    # Fit, never crop: preserves Gemini composition and prevents edge data loss.
    ratio=min(w/image.width,h/image.height)
    fg=image.resize((max(1,int(image.width*ratio)),max(1,int(image.height*ratio))),Image.Resampling.LANCZOS)
    bg=image.resize((w,h),Image.Resampling.LANCZOS)
    # soft background without requiring extra dependencies
    try:
        from PIL import ImageFilter
        bg=bg.filter(ImageFilter.GaussianBlur(28))
    except Exception: pass
    x=(w-fg.width)//2; y=(h-fg.height)//2
    bg.paste(fg,(x,y))
    return bg


def _draw_text(draw,xy,text,font,anchor="la"):
    # Deterministic readable text without cards/panels.
    x,y=xy
    draw.text((x+2,y+3),text,font=font,fill=(0,0,0,230),stroke_width=4,stroke_fill=(0,0,0,210),anchor=anchor)
    draw.text((x,y),text,font=font,fill=(255,255,255,255),stroke_width=2,stroke_fill=(20,20,20,230),anchor=anchor)


def overlay_stats(image_bytes,player,logo_path="assets/titani_logo.jpg"):
    """Gemini creates only the art. Exact player data is rendered locally once, preventing hallucinations, duplicates and cut values."""
    image=Image.open(io.BytesIO(image_bytes)).convert("RGB")
    image=_fit_canvas(image,1080,1350).convert("RGBA")
    draw=ImageDraw.Draw(image,"RGBA")
    title=_font(43,True); normal=_font(29,True); small=_font(25,True)
    name=str(_value(player,'name')); tag=str(_value(player,'tag')); club=str(_value(player,'club_name','club'))
    trophies=_fmt(_value(player,'trophies')); level=_fmt(_value(player,'level')); brawlers=_fmt(_value(player,'brawlers')); prestige=_fmt(_value(player,'prestige'))
    wins3=_fmt(_value(player,'wins_3v3')); solo=_fmt(_value(player,'wins_solo')); duo=_fmt(_value(player,'wins_duo'))
    ranked=_fmt(_value(player,'ranked_current')); record=_fmt(_value(player,'ranked_career_peak','ranked_peak'))
    # Safe-area typography: no generated text, no duplicate values, all inside frame.
    _draw_text(draw,(54,55),name,title)
    _draw_text(draw,(55,108),tag,small)
    _draw_text(draw,(55,146),f"CLUB  {club}",small)
    left=[f"TROFEI  {trophies}",f"LIVELLO  {level}",f"BRAWLER  {brawlers}",f"PRESTIGIO  {prestige}"]
    right=[f"VITTORIE 3v3  {wins3}",f"SOLO  {solo}   DUO  {duo}",f"CLASSIFICATA  {ranked}",f"RECORD  {record}"]
    y=1165
    for row in left:
        _draw_text(draw,(55,y),row,normal); y+=38
    y=1165
    for row in right:
        _draw_text(draw,(1025,y),row,normal,anchor="ra"); y+=38
    out=io.BytesIO(); image.convert("RGB").save(out,"JPEG",quality=95,optimize=True); out.seek(0); return out
'''
          s=s[:start]+replacement+'\n'
          p.write_text(s)
          PY
      - name: Validate
        run: python -m py_compile ai_profile_generator.py
      - name: Commit
        run: |
          git config user.name 'Sens GPT Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add ai_profile_generator.py
          git commit -m 'Render exact AI profile stats deterministically'
          git push
