name: Validate Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Compile all critical Python files
        run: python -m py_compile app.py community_features.py player_tracking.py visual_cards.py
      - name: Import visual module smoke test
        run: |
          python - <<'PY'
          from visual_cards import build_player_stats_card, build_ranking_card
          p={"name":"TA | Persinox","tag":"#2VQYLG0RU8","club_name":"TITANI ABUSIVI","trophies":14452,"brawlers":49,"level":46,"prestige":11,"ranked_current":"Argento I","ranked_season_peak":"Argento I","ranked_career_peak":"Argento I","wins_3v3":215,"wins_solo":548,"wins_duo":3}
          card=build_player_stats_card(p,{"today":0})
          assert len(card.getvalue()) > 1000
          rank=build_ranking_card('TEST',[{"name":"TA | Persinox","tag":"2VQYLG0RU8","value":809,"display_value":"Argento I"}], 'classificata', 1)
          assert len(rank.getvalue()) > 1000
          print('visual renderer smoke test OK')
          PY
