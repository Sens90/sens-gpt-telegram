name: Patch AI profile parser

on:
  push:
    paths:
      - '.github/workflows/patch-ai-profile-parser.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch parser
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '''    profile_image_match = re.fullmatch(\n        r"(?:profilo ai|profilo grafico|immagine profilo|profile image)(?:\\s+(sorprendimi|brawl|cinema|epico|fantascienza|fantasy))?\\s*#?([0289PYLQGRJCUV]{3,15})(?:\\s+con\\s+([A-Za-z0-9À-ÿ ._'’-]{2,30}))?",\n        question.strip(), re.I\n    )\n    if profile_image_match:\n        category_map = {\n            "sorprendimi": "random", "brawl": "official", "cinema": "cinema",\n            "epico": "epic", "fantascienza": "scifi", "fantasy": "fantasy"\n        }\n        category = category_map.get((profile_image_match.group(1) or "sorprendimi").lower(), "random")\n'''
          new = '''    profile_image_match = re.fullmatch(\n        r"(?:profilo ai|profilo grafico|immagine profilo|profile image)(?:\\s+(sorprendimi|brawl|cinematic|al\\s+cinema|epico|fantascienza|fantasy))?\\s*#?([0289PYLQGRJCUV]{3,15})(?:\\s+con\\s+([A-Za-z0-9À-ÿ ._'’-]{2,30}))?",\n        question.strip(), re.I\n    )\n    if profile_image_match:\n        category_map = {\n            "sorprendimi": "random",\n            "brawl": "official",\n            "cinematic": "cinematic",\n            "al cinema": "cinema",\n            "epico": "epic",\n            "fantascienza": "scifi",\n            "fantasy": "fantasy",\n        }\n        mode_key = re.sub(r"\\s+", " ", (profile_image_match.group(1) or "sorprendimi").strip().lower())\n        category = category_map.get(mode_key, "random")\n'''
          if old not in s:
              raise SystemExit('Expected parser block not found; refusing unsafe patch')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit parser patch
        run: |
          git config user.name "Sens GPT automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "Wire cinematic and al cinema profile commands"
          git push
